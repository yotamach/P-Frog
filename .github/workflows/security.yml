name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-audit:
    name: Dependency Audit (yarn audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Run audit (all deps, informational)
        run: yarn audit --level moderate
        continue-on-error: true

      - name: Run audit (production deps only, fail on high/critical)
        run: |
          set +e
          yarn audit --groups dependencies --level high --json > /tmp/audit.json 2>&1

          python3 - << 'PYEOF'
          import json, sys

          # Accepted advisories: minimatch ReDoS via swagger-jsdoc > glob > minimatch.
          # swagger-jsdoc@6.2.8 (latest) pins glob@7.1.6 with no upstream fix available.
          # The glob patterns come from app config, not user input, so ReDoS is not exploitable.
          ALLOWLIST = {1113459, 1113538, 1113546}

          found, seen = [], set()
          with open('/tmp/audit.json') as f:
              for line in f:
                  try:
                      d = json.loads(line)
                      if d.get('type') == 'auditAdvisory':
                          adv = d['data']['advisory']
                          if adv['id'] not in ALLOWLIST and adv['id'] not in seen:
                              seen.add(adv['id'])
                              found.append(
                                  f"{adv['severity'].upper()}: {adv['module_name']} "
                                  f"(advisory {adv['id']}) — {adv['title']}"
                              )
                  except Exception:
                      pass

          if found:
              print("Unacceptable production dependency vulnerabilities found:")
              for item in found:
                  print(f"  {item}")
              sys.exit(1)

          print("All production dependency vulnerabilities are patched or accepted.")
          PYEOF

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
